source:
  server: "localhost,1434"
  database: "SourceDatabase"
  username_env: "SOURCE_DB_USER"
  password_env: "SOURCE_DB_PASSWORD"
  schema: "source_schema"

target:
  server: "localhost,1435"
  database: "TargetDatabase"
  username_env: "TARGET_DB_USER"
  password_env: "TARGET_DB_PASSWORD"
  schema: "target_schema"

options:
  batch_size: 1000
  clear_target_tables_first: false
  trust_server_certificate: true
  encrypt: false
  driver: "ODBC Driver 18 for SQL Server"
  fast_executemany: false

# Supported modes:
# - include_tables: copy only the explicit list below. This is the existing/default mode.
# - copy_all_from_schema: discover and copy every base table from source.schema,
#   except the optional exclude_tables list.
mode: include_tables

tables:
  - Users
  - Orders
  - OrderItems

# Used only when mode: copy_all_from_schema
exclude_tables:
  - Users

